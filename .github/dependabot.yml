# Surveillance automatique des dépendances du site.
# Dependabot propose chaque mois les mises à jour sous forme de pull requests,
# et immédiatement les correctifs de sécurité.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Casablanca"
    open-pull-requests-limit: 5
    groups:
      # Mises à jour mineures et correctifs regroupés en une seule PR
      mineures:
        update-types:
          - "minor"
          - "patch"
      # Outils de vérification de code (non exposés aux visiteurs)
      outils-dev:
        dependency-type: "development"
    ignore:
      # Les montées de version majeures de Next.js et React se font à la main,
      # après lecture des notes de migration.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # ESLint 10 casse eslint-config-next 16.4.x (le lint ne démarre plus).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 : à tester à la main avant d'adopter.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Doit suivre la version de Node sur Hostinger (22), pas la dernière.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
